<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>活动专属二维码领取</title>
<style>
  :root {
    --ground: #f2f5f4;
    --card: #ffffff;
    --ink: #1a2622;
    --ink-soft: #5c6d67;
    --line: #dde5e2;
    --accent: #0e7c66;
    --accent-ink: #ffffff;
    --accent-soft: #e2f1ec;
    --danger: #b3402f;
    --danger-soft: #f9e9e6;
    --shadow: 0 12px 32px rgba(23, 43, 38, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101614; --card: #1a2320; --ink: #e6edea; --ink-soft: #93a49e;
      --line: #2c3934; --accent: #35b394; --accent-ink: #0c1512;
      --accent-soft: #1e332c; --danger: #e07a63; --danger-soft: #3a231e;
      --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --ground: #101614; --card: #1a2320; --ink: #e6edea; --ink-soft: #93a49e;
    --line: #2c3934; --accent: #35b394; --accent-ink: #0c1512;
    --accent-soft: #1e332c; --danger: #e07a63; --danger-soft: #3a231e;
    --shadow: 0 12px 32px rgba(0, 0, 0, .45);
  }
  :root[data-theme="light"] {
    --ground: #f2f5f4; --card: #ffffff; --ink: #1a2622; --ink-soft: #5c6d67;
    --line: #dde5e2; --accent: #0e7c66; --accent-ink: #ffffff;
    --accent-soft: #e2f1ec; --danger: #b3402f; --danger-soft: #f9e9e6;
    --shadow: 0 12px 32px rgba(23, 43, 38, .10);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--ground); color: var(--ink);
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(16px, 5vw, 48px) 16px;
    -webkit-font-smoothing: antialiased;
  }
  .ticket { width: 100%; max-width: 420px; }
  .card {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    padding: 28px 28px 22px;
    border-bottom: 1px dashed var(--line);
    position: relative;
  }
  /* 票券缺口 */
  .card-head::before, .card-head::after {
    content: ""; position: absolute; bottom: -9px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--ground);
  }
  .card-head::before { left: -9px; }
  .card-head::after { right: -9px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .14em; color: var(--accent);
    font-weight: 600; text-transform: uppercase; margin-bottom: 8px;
  }
  h1 { font-size: 22px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
  .sub { margin-top: 8px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
  .card-body { padding: 24px 28px 28px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; }
  input[type="tel"] {
    flex: 1; min-width: 0; font-size: 17px; padding: 12px 14px;
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); outline: none;
    transition: border-color .15s;
  }
  input[type="tel"]:focus-visible { border-color: var(--accent); }
  button {
    font: inherit; font-size: 15px; font-weight: 600;
    padding: 12px 20px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
    transition: opacity .15s; white-space: nowrap;
  }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg {
    margin-top: 14px; font-size: 14px; line-height: 1.6; border-radius: 10px;
    padding: 10px 14px; display: none;
  }
  .msg.error { display: block; background: var(--danger-soft); color: var(--danger); }
  .msg.info { display: block; background: var(--accent-soft); color: var(--accent); }
  .result { display: none; text-align: center; padding-top: 6px; }
  .result.show { display: block; }
  .result .qr-wrap {
    display: inline-block; padding: 14px; background: #fff; border-radius: 14px;
    border: 1px solid var(--line); margin: 6px 0 4px;
  }
  .result img { display: block; width: 220px; max-width: 100%; height: auto; }
  .result .owner {
    font-size: 13px; color: var(--ink-soft); margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .result .hint { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .result .actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  .ghost {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .foot {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    margin-top: 18px; line-height: 1.6;
  }
  @media (prefers-reduced-motion: no-preference) {
    .result.show { animation: rise .35s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  }
</style>

<div class="ticket">
  <div class="card">
    <div class="card-head">
      <div class="eyebrow">专属领取</div>
      <h1>活动专属二维码领取</h1>
      <p class="sub">输入报名手机号，领取您的专属二维码（演示版）。</p>
    </div>
    <div class="card-body">
      <div id="form-view">
        <label for="phone">手机号</label>
        <div class="row">
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel"
                 maxlength="20" placeholder="请输入报名时的手机号">
          <button id="claim-btn">领取</button>
        </div>
        <div id="msg" class="msg" role="alert"></div>
      </div>
      <div id="result" class="result">
        <div class="qr-wrap"><img id="qr-img" alt="您的专属二维码"></div>
        <div class="owner" id="owner"></div>
        <div class="hint">长按图片可保存到相册</div>
        <div class="actions">
          <button id="download-btn">保存图片</button>
          <button id="back-btn" class="ghost">换个手机号</button>
        </div>
      </div>
    </div>
  </div>
  <p class="foot">每个手机号对应一张专属二维码，重复领取会得到同一张。<br>如遇问题请联系活动负责人。</p>
</div>

<script>
(function () {
  var vault = JSON.parse(document.getElementById('vault').textContent);
  var saltBytes = Uint8Array.from(atob(vault.salt), function (c) { return c.charCodeAt(0); });

  var phoneInput = document.getElementById('phone');
  var claimBtn = document.getElementById('claim-btn');
  var msg = document.getElementById('msg');
  var formView = document.getElementById('form-view');
  var result = document.getElementById('result');
  var qrImg = document.getElementById('qr-img');
  var owner = document.getElementById('owner');
  var downloadBtn = document.getElementById('download-btn');
  var backBtn = document.getElementById('back-btn');
  var currentBlob = null;

  function normalize(raw) {
    var digits = raw.replace(/\D/g, '');
    return digits.length > 11 ? digits.slice(-11) : digits;
  }
  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }
  function clearMsg() { msg.className = 'msg'; }
  function toHex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

  async function deriveMaterial(phone) {
    var baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(phone), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: saltBytes, iterations: vault.iter },
      baseKey, 8 * 48);
  }

  async function claim(phone, silent) {
    if (!/^1\d{10}$/.test(phone) && phone.length !== 11) {
      // 非典型手机号也允许尝试（境外号等），但空的不行
      if (!phone) { showMsg('请输入手机号', 'error'); return; }
    }
    claimBtn.disabled = true;
    claimBtn.textContent = '查找中…';
    clearMsg();
    try {
      var material = await deriveMaterial(phone);
      var index = toHex(material.slice(0, 16));
      var entry = vault.entries[index];
      if (!entry) {
        if (!silent) showMsg('该手机号不在领取名单内，请确认输入是否正确。', 'error');
        return;
      }
      var key = await crypto.subtle.importKey(
        'raw', material.slice(16, 48), 'AES-GCM', false, ['decrypt']);
      var packed = Uint8Array.from(atob(entry.d), function (c) { return c.charCodeAt(0); });
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: packed.slice(0, 12) }, key, packed.slice(12));
      currentBlob = new Blob([plain], { type: entry.m });
      if (qrImg.src) URL.revokeObjectURL(qrImg.src);
      qrImg.src = URL.createObjectURL(currentBlob);
      owner.textContent = '绑定手机号：' + phone.slice(0, 3) + '****' + phone.slice(-4);
      formView.style.display = 'none';
      result.classList.add('show');
      try { localStorage.setItem('claimed_phone', phone); } catch (e) {}
    } catch (e) {
      if (!silent) showMsg('解锁失败，请重试。若持续失败请联系活动负责人。', 'error');
    } finally {
      claimBtn.disabled = false;
      claimBtn.textContent = '领取';
    }
  }

  claimBtn.addEventListener('click', function () {
    claim(normalize(phoneInput.value), false);
  });
  phoneInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') claim(normalize(phoneInput.value), false);
  });
  function anchorDownload(filename) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(currentBlob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  downloadBtn.addEventListener('click', function () {
    if (!currentBlob) return;
    var ext = currentBlob.type.indexOf('jpeg') >= 0 ? 'jpg'
      : (currentBlob.type.split('/')[1] || 'png');
    var filename = 'qrcode.' + ext;
    var dl = window.claude && window.claude.downloads;
    if (dl) {
      dl.save({ filename: filename, data: currentBlob }).catch(function (err) {
        // 用户拒绝或提示排队时不重试；能力不可用时回退到普通下载
        if (err && (err.code === 'declined' || err.code === 'rate_limited')) return;
        anchorDownload(filename);
      });
    } else {
      anchorDownload(filename);
    }
  });
  backBtn.addEventListener('click', function () {
    result.classList.remove('show');
    formView.style.display = '';
    phoneInput.value = '';
    try { localStorage.removeItem('claimed_phone'); } catch (e) {}
    phoneInput.focus();
  });

  // 领过的手机号回访时自动展示
  try {
    var saved = localStorage.getItem('claimed_phone');
    if (saved) { phoneInput.value = saved; claim(saved, true); }
  } catch (e) {}

  if (!window.isSecureContext || !crypto.subtle) {
    showMsg('当前环境不支持安全解密，请在 HTTPS 页面中打开。', 'error');
    claimBtn.disabled = true;
  }
})();
</script>
