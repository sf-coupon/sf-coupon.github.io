<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>領取順豐快遞電子現金券</title>
<style>
  :root {
    --ground: #f2f5f4;
    --card: #ffffff;
    --ink: #1a2622;
    --ink-soft: #5c6d67;
    --line: #dde5e2;
    --accent: #0e7c66;
    --accent-ink: #ffffff;
    --accent-soft: #e2f1ec;
    --danger: #b3402f;
    --danger-soft: #f9e9e6;
    --shadow: 0 12px 32px rgba(23, 43, 38, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101614; --card: #1a2320; --ink: #e6edea; --ink-soft: #93a49e;
      --line: #2c3934; --accent: #35b394; --accent-ink: #0c1512;
      --accent-soft: #1e332c; --danger: #e07a63; --danger-soft: #3a231e;
      --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --ground: #101614; --card: #1a2320; --ink: #e6edea; --ink-soft: #93a49e;
    --line: #2c3934; --accent: #35b394; --accent-ink: #0c1512;
    --accent-soft: #1e332c; --danger: #e07a63; --danger-soft: #3a231e;
    --shadow: 0 12px 32px rgba(0, 0, 0, .45);
  }
  :root[data-theme="light"] {
    --ground: #f2f5f4; --card: #ffffff; --ink: #1a2622; --ink-soft: #5c6d67;
    --line: #dde5e2; --accent: #0e7c66; --accent-ink: #ffffff;
    --accent-soft: #e2f1ec; --danger: #b3402f; --danger-soft: #f9e9e6;
    --shadow: 0 12px 32px rgba(23, 43, 38, .10);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
      "Hiragino Sans", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--ground); color: var(--ink);
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(16px, 5vw, 48px) 16px;
    -webkit-font-smoothing: antialiased;
  }
  .ticket { width: 100%; max-width: 440px; }
  .card {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    padding: 28px 28px 22px;
    border-bottom: 1px dashed var(--line);
    position: relative;
  }
  .card-head::before, .card-head::after {
    content: ""; position: absolute; bottom: -9px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--ground);
  }
  .card-head::before { left: -9px; }
  .card-head::after { right: -9px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .14em; color: var(--accent);
    font-weight: 600; margin-bottom: 8px;
  }
  h1 { font-size: 22px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
  .sub { margin-top: 8px; font-size: 14px; color: var(--ink-soft); line-height: 1.7; }
  .card-body { padding: 22px 28px 28px; }
  .seg {
    display: flex; background: var(--ground); border-radius: 10px;
    padding: 3px; margin-bottom: 16px; gap: 3px;
  }
  .seg button {
    flex: 1; font: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 0; border: none; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--ink-soft); transition: background .15s;
  }
  .seg button.active {
    background: var(--card); color: var(--ink);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
  }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; }
  .field {
    flex: 1; min-width: 0; display: flex; align-items: center;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card); transition: border-color .15s;
  }
  .field:focus-within { border-color: var(--accent); }
  .prefix {
    padding: 0 4px 0 14px; font-size: 17px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; user-select: none; white-space: nowrap;
  }
  .field input {
    flex: 1; min-width: 0; font-size: 17px; padding: 12px 14px 12px 6px;
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
    border: none; background: transparent; color: var(--ink); outline: none;
  }
  .field input.email { padding-left: 14px; letter-spacing: 0; }
  .go {
    font: inherit; font-size: 15px; font-weight: 600;
    padding: 12px 20px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
    transition: opacity .15s; white-space: nowrap;
  }
  .go:disabled { opacity: .55; cursor: default; }
  .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg {
    margin-top: 14px; font-size: 14px; line-height: 1.6; border-radius: 10px;
    padding: 10px 14px; display: none;
  }
  .msg.error { display: block; background: var(--danger-soft); color: var(--danger); }
  .result { display: none; text-align: center; padding-top: 6px; }
  .result.show { display: block; }
  .result .qr-wrap {
    padding: 12px; background: #fff; border-radius: 14px;
    border: 1px solid var(--line); margin: 6px 0 4px;
  }
  .result img { display: block; width: 100%; height: auto; }
  .result .owner {
    font-size: 13px; color: var(--ink-soft); margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .result .hint { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .result .actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  .result .actions button {
    font: inherit; font-size: 15px; font-weight: 600;
    padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer;
  }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .ghost {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent) !important;
  }
  .foot {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    margin-top: 18px; line-height: 1.7;
  }
  @media (prefers-reduced-motion: no-preference) {
    .result.show { animation: rise .35s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  }
</style>

<div class="ticket">
  <div class="card">
    <div class="card-head">
      <div class="eyebrow">專屬領取</div>
      <h1>領取順豐快遞電子現金券</h1>
      <p class="sub">輸入你登記嘅手機號碼或者電郵地址，即刻攞你嘅專屬港幣 $25 順豐電子現金券。</p>
    </div>
    <div class="card-body">
      <div id="form-view">
        <div class="seg" role="tablist">
          <button id="tab-phone" class="active" type="button">手機號碼</button>
          <button id="tab-email" type="button">電郵地址</button>
        </div>
        <div id="pane-phone">
          <label for="phone">手機號碼</label>
          <div class="row">
            <div class="field">
              <span class="prefix">+852</span>
              <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
                     maxlength="16" placeholder="8 位手機號碼">
            </div>
            <button id="claim-btn" class="go">領取</button>
          </div>
        </div>
        <div id="pane-email" style="display:none">
          <label for="email">電郵地址</label>
          <div class="row">
            <div class="field">
              <input id="email" class="email" type="email" autocomplete="email"
                     maxlength="80" placeholder="登記時用嘅電郵">
            </div>
            <button id="claim-btn-email" class="go">領取</button>
          </div>
        </div>
        <div id="msg" class="msg" role="alert"></div>
      </div>
      <div id="result" class="result">
        <div class="qr-wrap"><img id="qr-img" alt="你嘅專屬現金券二維碼"></div>
        <div class="owner" id="owner"></div>
        <div class="hint">長按圖片可以儲存到相簿</div>
        <div class="actions">
          <button id="download-btn" class="primary">儲存圖片</button>
          <button id="back-btn" class="ghost">重新輸入</button>
        </div>
      </div>
    </div>
  </div>
  <p class="foot">每個號碼／電郵對應一張專屬現金券，重複領取都係同一張。<br>有咩問題請聯絡你嘅客戶經理。</p>
</div>

<script>
(function () {
  var vault = JSON.parse(document.getElementById('vault').textContent);
  var saltBytes = Uint8Array.from(atob(vault.salt), function (c) { return c.charCodeAt(0); });

  var tabPhone = document.getElementById('tab-phone');
  var tabEmail = document.getElementById('tab-email');
  var panePhone = document.getElementById('pane-phone');
  var paneEmail = document.getElementById('pane-email');
  var phoneInput = document.getElementById('phone');
  var emailInput = document.getElementById('email');
  var btnPhone = document.getElementById('claim-btn');
  var btnEmail = document.getElementById('claim-btn-email');
  var msg = document.getElementById('msg');
  var formView = document.getElementById('form-view');
  var result = document.getElementById('result');
  var qrImg = document.getElementById('qr-img');
  var owner = document.getElementById('owner');
  var downloadBtn = document.getElementById('download-btn');
  var backBtn = document.getElementById('back-btn');
  var currentBlob = null;
  var mode = 'p';

  function setMode(m) {
    mode = m;
    tabPhone.className = m === 'p' ? 'active' : '';
    tabEmail.className = m === 'e' ? 'active' : '';
    panePhone.style.display = m === 'p' ? '' : 'none';
    paneEmail.style.display = m === 'e' ? '' : 'none';
    clearMsg();
  }
  tabPhone.addEventListener('click', function () { setMode('p'); });
  tabEmail.addEventListener('click', function () { setMode('e'); });

  function showMsg(text) { msg.textContent = text; msg.className = 'msg error'; }
  function clearMsg() { msg.className = 'msg'; }
  function toHex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

  // 返回 {id: 用於加密的標識, show: 用於展示的脫敏文本}，非法輸入返回 null 並提示
  function canonical() {
    if (mode === 'p') {
      var digits = phoneInput.value.replace(/\D/g, '');
      if (digits.length > 8 && digits.indexOf('852') === 0) digits = digits.slice(3);
      if (!digits) { showMsg('請輸入手機號碼'); return null; }
      if (digits.length !== 8) { showMsg('手機號碼格式唔啱，應該係 8 位數字（+852）'); return null; }
      return { id: '852' + digits,
               show: '+852 ' + digits.slice(0, 2) + '****' + digits.slice(-2) };
    }
    var email = emailInput.value.trim().toLowerCase();
    if (!email) { showMsg('請輸入電郵地址'); return null; }
    if (email.indexOf('@') < 1) { showMsg('電郵地址格式唔啱'); return null; }
    var at = email.indexOf('@');
    return { id: email, show: email.slice(0, 2) + '***' + email.slice(at) };
  }

  async function deriveMaterial(id) {
    var baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(id), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: saltBytes, iterations: vault.iter },
      baseKey, 8 * 48);
  }

  async function claim(ident, silent) {
    var btn = mode === 'p' ? btnPhone : btnEmail;
    btn.disabled = true;
    btn.textContent = '搵緊…';
    clearMsg();
    try {
      var material = await deriveMaterial(ident.id);
      var index = toHex(material.slice(0, 16));
      var entry = vault.entries[index];
      if (!entry) {
        if (!silent) showMsg(mode === 'p'
          ? '呢個手機號碼唔喺領取名單度，請確認同登記時一致。'
          : '呢個電郵唔喺領取名單度，請確認同登記時一致。');
        return;
      }
      var key = await crypto.subtle.importKey(
        'raw', material.slice(16, 48), 'AES-GCM', false, ['decrypt']);
      var packed = Uint8Array.from(atob(entry.d), function (c) { return c.charCodeAt(0); });
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: packed.slice(0, 12) }, key, packed.slice(12));
      currentBlob = new Blob([plain], { type: entry.m });
      if (qrImg.src) URL.revokeObjectURL(qrImg.src);
      qrImg.src = URL.createObjectURL(currentBlob);
      owner.textContent = (mode === 'p' ? '綁定號碼：' : '綁定電郵：') + ident.show;
      formView.style.display = 'none';
      result.classList.add('show');
      try {
        localStorage.setItem('claimed', JSON.stringify(
          { m: mode, v: mode === 'p' ? phoneInput.value : emailInput.value }));
      } catch (e) {}
    } catch (e) {
      if (!silent) showMsg('出咗啲問題，請再試一次。如果一直唔得，請聯絡你嘅客戶經理。');
    } finally {
      btn.disabled = false;
      btn.textContent = '領取';
    }
  }

  function go(silent) {
    var ident = canonical();
    if (ident) claim(ident, silent);
  }
  btnPhone.addEventListener('click', function () { go(false); });
  btnEmail.addEventListener('click', function () { go(false); });
  phoneInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(false); });
  emailInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(false); });

  function anchorDownload(filename) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(currentBlob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  downloadBtn.addEventListener('click', function () {
    if (!currentBlob) return;
    var ext = currentBlob.type.indexOf('jpeg') >= 0 ? 'jpg'
      : (currentBlob.type.split('/')[1] || 'png');
    var filename = 'coupon.' + ext;
    var dl = window.claude && window.claude.downloads;
    if (dl) {
      dl.save({ filename: filename, data: currentBlob }).catch(function (err) {
        if (err && (err.code === 'declined' || err.code === 'rate_limited')) return;
        anchorDownload(filename);
      });
    } else {
      anchorDownload(filename);
    }
  });
  backBtn.addEventListener('click', function () {
    result.classList.remove('show');
    formView.style.display = '';
    phoneInput.value = '';
    emailInput.value = '';
    try { localStorage.removeItem('claimed'); } catch (e) {}
    (mode === 'p' ? phoneInput : emailInput).focus();
  });

  // 領過嘅人返嚟自動展示
  try {
    var saved = JSON.parse(localStorage.getItem('claimed') || 'null');
    if (saved && saved.v) {
      setMode(saved.m === 'e' ? 'e' : 'p');
      if (saved.m === 'e') emailInput.value = saved.v; else phoneInput.value = saved.v;
      go(true);
    }
  } catch (e) {}

  if (!window.isSecureContext || !crypto.subtle) {
    showMsg('目前環境唔支持安全解密，請用 HTTPS 開啟呢一頁。');
    btnPhone.disabled = true;
    btnEmail.disabled = true;
  }
})();
</script>
